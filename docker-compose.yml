version: '3.8'

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: skillsetu-backend
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=sqlite:///./skillsetu.db
      - SECRET_KEY=skillsetu_sih_super_secure_jwt_secret_key_2026_change_in_production
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: skillsetu-frontend
    ports:
      - "3000:80"
    depends_on:
      - backend
    restart: unless-stopped
